# DPLEvolve Ablation: Multi-Seed Reproducibility
# Runs the same experiment with multiple random seeds to quantify variance.
# Post-deadline experiment (reviewer-requested).

experiment: multi_seed
description: >
  Run the full ReviewDSE pipeline with multiple random seeds to
  establish statistical significance of the HPWL improvement.

seeds: [42, 123, 456, 789, 1024]  # 5 seeds for statistical validity

cases:
  - aes_nangate45
  - jpeg_nangate45

metrics:
  - mean_hpwl_improvement_pct  (across seeds)
  - std_hpwl_improvement_pct   (across seeds)
  - median_hpwl_improvement_pct
  - min_hpwl_improvement_pct
  - max_hpwl_improvement_pct
  - success_rate (cases improved / total)

budget:
  max_rounds: 10
  candidates_per_round: 16

notes: >
  Report mean ± std, not just the best run.
  At minimum 3 seeds; 5 preferred for credible statistics.
