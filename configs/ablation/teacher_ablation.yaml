# DPLEvolve Ablation: Teacher Agent Effectiveness
# Quantifies the benefit of the Teacher agent's screening and feedback.
# Post-deadline experiment (reviewer-requested).

experiment: ablation
ablation_target: teacher_effectiveness
description: >
  Compare the full Teacher-Student system against a Student-only baseline.
  Measures: search efficiency, failure rate, final HPWL improvement.

conditions:
  - name: full_teacher_student
    teacher_enabled: true
    num_students: 4
  - name: student_only
    teacher_enabled: false
    num_students: 4
  - name: single_agent
    teacher_enabled: false
    num_students: 1

cases:
  - aes_nangate45
  - jpeg_nangate45

metrics:
  - mean_hpwl_improvement_pct
  - candidate_success_rate
  - compilation_failure_rate
  - duplicate_proposal_rate
  - token_usage
  - iterations_to_convergence

budget:
  max_rounds: 6
  candidates_per_round: 8
