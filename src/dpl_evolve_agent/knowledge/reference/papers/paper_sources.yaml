schema_version: 2
purpose: >
  Curated paper/source handles for dpl_evolve legalization and DPO research.
  Optional cached PDFs are source-text verification aids only unless a
  redistribution policy is explicitly checked.  Algorithm pseudocode derived
  from these sources lives in
  knowledge/algorithms/*_paper_pseudocode.md and the split cards under
  knowledge/algorithms/legalization/ and
  knowledge/algorithms/dpo_refinement/.

papers:
  - id: openroad_dpl_docs
    title: "OpenROAD Detailed Placement Documentation"
    role: "Command and engine context for Diamond Search, NegotiationLegalizer, detailed_placement, improve_placement, and optimize_mirroring."
    source_url: "https://openroad.readthedocs.io/en/latest/main/src/dpl/README.html"
    git_policy: "link_only"
    fetch_policy: "browse_official_docs"
    notes:
      - "Use this for OpenROAD DPL command truth."
      - "Do not confuse with the OpenDP-named committed fence-region reference."

  - id: fence_region_aware_2019
