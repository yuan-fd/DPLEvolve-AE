policy:
  deny_by_default: true
  require_patch_note: true
  require_task_reference: true
  keep_entrypoint_stable: "detailed_placement_evolve"
  allow_aggressive_algorithm_edits: true
  do_not_patch:
    - "tools/OpenROAD/src/dpl"
    - "baseline evaluator/scoring scripts"
    - "benchmark or snapshot selection"

notes:
  - "Students are expected to make coherent changes across LEGALM/legalization, detailed-improvement internals, and their shared top-level handoff when Teacher requests a full-flow attempt."
  - "Do not hide HPWL or flow-level experiments inside a paper-fidelity claim; label them as objective or flow redesign."
  - "Use private variant source plus lightweight relink for normal student algorithm experiments."
